[phases.setup]
nixPkgs = ["go", "nodejs", "pnpm"]

[phases.install]
cmds = ["cd frontend && pnpm install"]

[phases.build]
cmds = [
    "cd frontend && pnpm run build",
    "mkdir -p backend/static",
    "cp -r frontend/dist/* backend/static/",
    "cd backend && go build -ldflags='-w -s' -o out ."
]

[start]
cmd = "./backend/out"
