[phases.setup]
nixPkgs = ["go", "nodejs", "pnpm", "gcc", "glibc"]

[variables]
CGO_ENABLED = "1"
GOOS = "linux"

[phases.install]
cmds = ["cd frontend && pnpm install"]

[phases.build]
cmds = [
    "cd frontend && pnpm run build",
    "rm -rf backend/static && mkdir -p backend/static backend/uploads/avatars",
    "cp -r frontend/dist/* backend/static/",
    "ls -R backend/static",
    "cd backend && go build -ldflags='-w -s' -o out main.go"
]

[start]
cmd = "./backend/out"
